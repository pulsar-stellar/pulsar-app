# Workspace members for the TypeScript side of pulsar-app.
#
# indexer/ is deliberately absent: it is a Go module with its own go.mod and its
# own toolchain, so pnpm has nothing to install or build there. See ADR-002.
#
# Documentation lives in the separate pulsar-docs repo, so there is no apps/docs
# member here. See ADR-009.
packages:
  - packages/*
  - apps/*

# Strictness settings. pnpm 11 reads these here rather than from .npmrc, which
# it now ignores for pnpm-specific keys. Rationale in ADR-001.

# Fail rather than silently resolve a peer dependency we did not declare.
autoInstallPeers: false
strictPeerDependencies: true

# Refuse to install under a Node or pnpm version outside the engines range.
engineStrict: true

# No implicit hoisting: a workspace may only import what it declares.
shamefullyHoist: false
